<style>
/* Mesmo esqueleto do Desfrangolizador (barra lateral no desktop, barra inferior no celular, cartões de vidro), em azul-marinho com detalhes em latão. Tema único escuro. */
:root{
  color-scheme:dark;
  --bg:#071420; --bg-glow1:rgba(40,110,190,.22); --bg-glow2:rgba(210,165,70,.10);
  --surface:#0E1F30; --surface2:#15293D; --surface3:#1C344B; --glass:rgba(255,255,255,.045); --glass-b:rgba(255,255,255,.09);
  --ink:#EDF2F7; --muted:#9AAEC2; --faint:#62788E; --line:#1F3650;
  --accent:#E3B54A; --accent-ink:#F0CB73; --accent-soft:rgba(227,181,74,.14); --on-accent:#1E1503;
  --blue:#4FA3F7; --good:#3DDC97; --warn:#F2B14A; --bad:#F06A5C;
  --brass:linear-gradient(135deg,#F0CB73,#C98F2A);
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --f-display:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:18px; --r-sm:11px;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg) radial-gradient(1200px 700px at 85% -10%,var(--bg-glow1),transparent 60%) fixed,radial-gradient(900px 600px at -10% 110%,var(--bg-glow2),transparent 60%) fixed;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block}
a{color:var(--accent-ink)}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
[hidden]{display:none!important}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:22px 16px;border-right:1px solid var(--glass-b);background:rgba(7,20,32,.6);backdrop-filter:blur(12px);display:flex;flex-direction:column;gap:22px}
.brand{display:flex;align-items:center;gap:11px;padding:0 6px}
.brand img{width:42px;height:42px;flex:none;border-radius:11px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.brand-name{font-family:var(--f-display);font-weight:800;font-size:16px;letter-spacing:-.01em;line-height:1.1}
.brand-sub{font-size:11px;color:var(--accent-ink);font-weight:600;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:none;padding:11px 12px;border-radius:12px;color:var(--muted);font-weight:600;text-align:left}
.nav button svg{width:21px;height:21px;flex:none}
.nav button:hover{background:var(--glass);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--ink);box-shadow:inset 0 0 0 1px rgba(227,181,74,.25)}
.nav button[aria-current="page"] svg{color:var(--accent)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;font-size:12px;color:var(--faint)}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--faint);display:inline-block}
.sync.ok i{background:var(--good);box-shadow:0 0 8px var(--good)} .sync.err i{background:var(--bad)} .sync.saving i{background:var(--warn)}

.main{min-width:0;padding-block:24px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.topbar{display:flex;align-items:center;gap:12px}
.topbar .brand{display:none;padding:0}
.hello{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.15}
.hello-sub{color:var(--muted);font-size:13.5px}
.avatar{margin-left:auto;width:42px;height:42px;border-radius:50%;background:var(--brass);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:800;font-size:16px;flex:none;border:2px solid rgba(255,255,255,.15)}

.tabbar{display:none}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .topbar .brand{display:flex}
  .topbar .brand img{width:36px;height:36px}
  .topbar .hello-wrap{display:none}
  .main{padding-top:max(14px,env(safe-area-inset-top,0px));padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
  .tabbar{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(8,20,32,.92);backdrop-filter:blur(14px);border-top:1px solid var(--glass-b);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar button{border:0;background:none;color:var(--faint);display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;font-size:11px;font-weight:600;border-radius:12px}
  .tabbar button svg{width:22px;height:22px}
  .tabbar button[aria-current="page"]{color:var(--accent-ink)}
}

/* ---------- peças ---------- */
.card{background:linear-gradient(180deg,var(--glass),rgba(255,255,255,.02));border:1px solid var(--glass-b);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.card-h h2{font-family:var(--f-display);font-size:17px;font-weight:700}
.sub{color:var(--muted);font-size:13.5px}
.row{display:flex;align-items:center;gap:10px}
.col{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink);font-weight:700}
.page-h{display:flex;flex-direction:column;gap:6px}
.page-h h1{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,4vw,32px);letter-spacing:-.01em;line-height:1.1}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--muted);font-weight:600;padding:4px 0;font-size:14px;align-self:flex-start}
.back svg{width:18px;height:18px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--glass-b);background:var(--surface2);color:var(--ink);padding:10px 16px;border-radius:12px;font-weight:600;min-height:44px}
.btn svg{width:18px;height:18px}
.btn:hover{background:var(--surface3)}
.btn.primary{background:var(--brass);border-color:transparent;color:var(--on-accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:7px 12px;min-height:36px;font-size:13.5px}
.btn[disabled]{opacity:.55;cursor:default}
.iconbtn{border:1px solid var(--glass-b);background:var(--surface2);width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
.iconbtn svg{width:19px;height:19px}

.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.input{width:100%;background:rgba(0,0,0,.25);border:1px solid var(--glass-b);border-radius:12px;padding:11px 13px;min-height:46px;font-size:16px}
.input:focus{outline:none;border-color:var(--accent)}
textarea.input{min-height:96px;resize:vertical;line-height:1.45}
.search{position:relative}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--faint)}
.search .input{padding-left:40px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--glass);border:1px solid var(--glass-b);color:var(--muted);white-space:nowrap}
.pill.good{color:var(--good);border-color:rgba(61,220,151,.3)}
.pill.warn{color:var(--warn);border-color:rgba(242,177,74,.35)}
.pill.accent{color:var(--accent-ink);border-color:rgba(227,181,74,.35)}

.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--glass);border:1px solid var(--glass-b);font-size:14px;line-height:1.5}
.note svg{width:19px;height:19px;flex:none;margin-top:1px;color:var(--accent)}
.note.warn{background:rgba(242,177,74,.08);border-color:rgba(242,177,74,.3)} .note.warn svg{color:var(--warn)}
.note.bad{background:rgba(240,106,92,.09);border-color:rgba(240,106,92,.35)} .note.bad svg{color:var(--bad)}
.note.good{background:rgba(61,220,151,.08);border-color:rgba(61,220,151,.3)} .note.good svg{color:var(--good)}

/* tiles clicáveis */
.tile{display:flex;flex-direction:column;gap:10px;text-align:left;border:1px solid var(--glass-b);background:linear-gradient(180deg,var(--glass),rgba(255,255,255,.015));border-radius:var(--r);padding:16px;color:var(--ink);min-height:120px}
.tile:hover{border-color:rgba(227,181,74,.35);background:var(--surface)}
.tile-i{width:42px;height:42px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.tile-i svg{width:22px;height:22px}
.tile b{font-family:var(--f-display);font-size:15.5px;font-weight:700;line-height:1.2}
.tile .foot{margin-top:auto;display:flex;align-items:center;gap:8px;justify-content:space-between}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--brass);border-radius:99px}

/* conteúdo do Bem-vindo */
.sec{border:1px solid var(--glass-b);border-radius:var(--r);background:linear-gradient(180deg,var(--glass),rgba(255,255,255,.015));overflow:hidden}
.sec>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:15px 16px;cursor:pointer}
.sec>summary::-webkit-details-marker{display:none}
.sec-n{width:30px;height:30px;border-radius:9px;background:var(--accent-soft);color:var(--accent-ink);font-family:var(--f-mono);font-weight:600;display:flex;align-items:center;justify-content:center;flex:none;font-size:14px}
.sec>summary b{font-family:var(--f-display);font-weight:700;font-size:15.5px;flex:1;line-height:1.25}
.sec>summary>svg{width:18px;height:18px;color:var(--faint);transition:transform .2s;flex:none}
.sec[open]>summary>svg:last-child{transform:rotate(180deg)}
.sec-body{padding:0 16px 18px;display:flex;flex-direction:column;gap:14px}
.blk-t{font-weight:700;font-size:14px;color:var(--accent-ink);margin-bottom:6px}
.prose{white-space:pre-line;line-height:1.6;font-size:14.5px}
.ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;line-height:1.55;font-size:14.5px}
.ul li::marker{color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip-v{display:flex;flex-direction:column;padding:9px 14px;border-radius:12px;background:rgba(0,0,0,.22);border:1px solid var(--glass-b);min-width:88px}
.chip-v small{font-size:11.5px;color:var(--muted);font-weight:600}
.chip-v span{font-family:var(--f-mono);font-weight:600;font-size:18px}
.chip-v.bad{border-color:rgba(240,106,92,.45)} .chip-v.bad span{color:var(--bad)}
.chip-v.blue{border-color:rgba(79,163,247,.45)} .chip-v.blue span{color:var(--blue)}
.chip-v.warn{border-color:rgba(242,177,74,.45)} .chip-v.warn span{color:var(--warn)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--glass-b);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:700;background:rgba(0,0,0,.2)}
tr:last-child td{border-bottom:0}
td:last-child{font-family:var(--f-mono)}
.mcards{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.mcard{padding:14px;border-radius:14px;background:rgba(0,0,0,.2);border:1px solid var(--glass-b);display:flex;flex-direction:column;gap:6px}
.mcard b{font-family:var(--f-display);font-size:14.5px}
.mcard p{font-size:14px;color:var(--muted);line-height:1.5}
.steps{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.step{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:rgba(0,0,0,.2);border:1px solid var(--glass-b);cursor:pointer;text-align:left;width:100%;color:var(--ink)}
.step .n{width:28px;height:28px;border-radius:50%;border:2px solid var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-weight:600;font-size:13px;flex:none}
.step span{line-height:1.5;font-size:14.5px;padding-top:2px}
.step.done{border-color:rgba(61,220,151,.35)}
.step.done .n{background:var(--good);border-color:var(--good);color:#04241A}
.step.done span{color:var(--muted)}

/* início */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:28px 26px 46px;background:radial-gradient(500px 300px at 85% 30%,rgba(226,85,60,.22),transparent 60%),linear-gradient(135deg,#102B45,#0A1A2B 60%,#071420);border:1px solid rgba(227,181,74,.25);box-shadow:0 20px 50px rgba(0,0,0,.4);display:grid;grid-template-columns:1fr 220px;gap:20px;align-items:center}
.hero-txt{position:relative;z-index:1;display:flex;flex-direction:column;gap:12px}
.hero-eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-ink);font-weight:700}
.hero h1{font-family:var(--f-display);font-weight:900;font-size:clamp(34px,6vw,52px);line-height:1;letter-spacing:-.02em}
.hero h1 span{background:var(--brass);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:#C3D2E0;font-size:15.5px;line-height:1.6;max-width:520px}
.hero p b{color:var(--ink)}
.hero-cta{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-top:4px}
.hero-prog{display:flex;align-items:center;gap:10px;min-width:200px;flex:1;max-width:280px;font-size:12.5px;color:var(--muted)}
.hero-art{position:relative;z-index:1;width:220px;filter:drop-shadow(0 12px 30px rgba(0,0,0,.5))}
.hero-art svg,.emblem-art svg{width:100%;height:auto}
.hero-waves{position:absolute;left:0;right:0;bottom:0;width:100%;height:46px}
.sec-title{display:flex;align-items:center;gap:10px;margin-top:6px}
.sec-title h2{font-family:var(--f-display);font-size:18px;font-weight:800;margin-right:auto}
.sec-title .btn svg{width:16px;height:16px}
.tile.soon{border-style:dashed;background:none;color:var(--muted)}
.blk-edit{position:relative;padding-right:40px}
.blk-edit>.iconbtn{position:absolute;top:0;right:0}
.iconbtn.sm{width:32px;height:32px;border-radius:9px}
.iconbtn.sm svg{width:15px;height:15px}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 20px,calc(100% - 13px) 20px;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.grid.mini{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.grid.mini .tile{min-height:0}
.linkcard{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;border:1px solid rgba(61,220,151,.35);background:linear-gradient(135deg,rgba(61,220,151,.10),rgba(255,255,255,.02));color:var(--ink);text-decoration:none}
.linkcard>span:nth-child(2){flex:1;display:flex;flex-direction:column;gap:2px}
.linkcard .tile-i{background:rgba(61,220,151,.15);color:var(--good)}
.linkcard>svg{width:18px;height:18px;color:var(--muted);flex:none}
.tile.soon .tile-i{background:var(--glass);color:var(--faint)}
.emblems{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.emblem{display:flex;gap:16px;align-items:center;padding:16px;border-radius:var(--r);border:1px solid rgba(227,181,74,.22);background:linear-gradient(135deg,rgba(226,85,60,.10),rgba(255,255,255,.02))}
.emblem.sea{border-color:rgba(79,163,247,.25);background:linear-gradient(135deg,rgba(79,163,247,.10),rgba(255,255,255,.02))}
.emblem-art{width:92px;flex:none}
.emblem b{display:block;font-family:var(--f-display);font-size:18px;margin:2px 0 4px}
@media (max-width:820px){
  .hero{grid-template-columns:1fr;padding:22px 18px 44px;text-align:left}
  .hero-art{position:absolute;right:-26px;top:-18px;width:150px;opacity:.28;z-index:0}
  .emblems{grid-template-columns:1fr}
}
/* incumbências */
.items{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;text-align:left;width:100%;border:1px solid var(--glass-b);background:linear-gradient(180deg,var(--glass),rgba(255,255,255,.015));border-radius:14px;padding:13px 14px;color:var(--ink)}
.item:hover{border-color:rgba(227,181,74,.35)}
.item-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.item-main b{font-weight:700;font-size:15px}
.kv{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted)}
.kv em{font-style:normal;color:var(--ink);font-family:var(--f-mono);font-size:12.5px}
.item>svg{width:18px;height:18px;color:var(--faint);flex:none}
.empty{color:var(--faint);font-size:13px}
.flab{display:flex;align-items:center;gap:6px;min-height:22px}
.flab label{flex:1}
.fx{border:0;background:none;color:var(--faint);width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;padding:0}
.fx svg{width:14px;height:14px}
.fx:hover{color:var(--bad);background:rgba(240,106,92,.1)}
.addfield{display:flex;gap:8px}
.addfield .input{min-height:40px;font-size:15px}
.netpill{display:none}
@media (max-width:820px){.netpill{display:inline-flex;margin-left:auto}.netpill+.avatar{margin-left:8px}}
.folder>summary .iconbtn.sm{width:32px;height:32px;border-radius:9px}
.folder>summary .iconbtn.sm svg{width:15px;height:15px}
.folder .sec-body{padding:0 10px 10px}
.tick{width:24px;height:24px;border-radius:7px;border:2px solid var(--faint);flex:none;display:flex;align-items:center;justify-content:center}
.tick svg{width:15px;height:15px}
.item.picked{border-color:rgba(227,181,74,.55);background:var(--accent-soft)}
.item.picked .tick{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.selbar{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:16px;background:#132A40;border:1px solid rgba(227,181,74,.35);box-shadow:var(--shadow)}
.selbar>span{margin-right:auto;font-size:14px}
@media (min-width:821px){.selbar{bottom:16px}}
.ring{width:42px;height:42px;flex:none}

/* modal */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(2,8,14,.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;background:linear-gradient(180deg,#132A40,#0D1F31);border:1px solid var(--glass-b);border-radius:22px;padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.sheet-h{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px}
.sheet-h h3{font-family:var(--f-display);font-size:19px;font-weight:800;line-height:1.2}
.sheet-h .iconbtn{margin-left:auto}
.fields2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:820px){.scrim{align-items:flex-end;padding:0}.sheet{border-radius:22px 22px 0 0;max-height:92vh;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}}
@media (max-width:340px){.fields2{grid-template-columns:1fr}}
.sheet-foot{position:sticky;bottom:-20px;margin:0 -20px -20px;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));background:#0D1F31;border-top:1px solid var(--glass-b)}
/* Tabelas viram cartões no celular: cada linha mostra o rótulo ao lado do valor. */
@media (max-width:600px){
  .tbl-wrap{border:0;overflow:visible}
  .tbl-wrap thead{display:none}
  .tbl-wrap tbody{display:grid;gap:8px}
  .tbl-wrap tr{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px 10px;padding:12px 14px;border:1px solid var(--glass-b);border-radius:12px;background:rgba(0,0,0,.2)}
  .tbl-wrap td{border:0;padding:0;white-space:normal;display:flex;flex-direction:column;font-family:var(--f-mono);font-size:14px}
  .tbl-wrap td::before{content:attr(data-l);font-family:var(--f-body);font-size:11px;color:var(--muted);font-weight:600}
  .tbl-wrap td:first-child{grid-column:1/-1;font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--accent-ink)}
  .tbl-wrap td:first-child::before{display:none}
}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:80;background:#1E3A54;border:1px solid var(--glass-b);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:var(--shadow)}
@media (min-width:821px){.toast{bottom:28px}}

/* entrada */
.gate{position:fixed;inset:0;z-index:90;overflow:auto;background:radial-gradient(900px 600px at 15% -10%,var(--bg-glow1),transparent 60%),radial-gradient(800px 600px at 110% 10%,var(--bg-glow2),transparent 60%),var(--bg);display:flex;align-items:center;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px max(24px,env(safe-area-inset-bottom,0px))}
.gate-in{width:min(940px,100%);display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center}
.gate-hero img{width:84px;height:84px;border-radius:22px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.gate-hero h1{font-family:var(--f-display);font-weight:900;font-size:clamp(28px,4.2vw,44px);line-height:1.05;margin:16px 0 12px;letter-spacing:-.02em}
.gate-hero h1 span{background:var(--brass);-webkit-background-clip:text;background-clip:text;color:transparent}
.gate-hero p{color:var(--muted);font-size:16px;line-height:1.55}
.gate-card{background:linear-gradient(180deg,#132A40,#0D1F31);border:1px solid var(--glass-b);border-radius:22px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.gate-card h2{margin:0 0 4px;font-family:var(--f-display);font-size:22px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:rgba(0,0,0,.25);padding:5px;border-radius:14px}
.seg button{border:0;border-radius:10px;padding:11px;font-weight:600;color:var(--muted);background:transparent}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
/* busca e menu do início */
.homebar{position:sticky;top:0;z-index:25;display:flex;flex-direction:column;gap:10px;margin:-6px -4px 0;padding:8px 4px 10px;background:linear-gradient(180deg,var(--bg) 82%,rgba(7,20,32,0))}
.gsearch{display:flex;align-items:center;gap:10px;padding:0 8px 0 14px;border-radius:16px;border:1px solid rgba(227,181,74,.35);background:#0F2235;min-height:52px}
.gsearch>svg{width:20px;height:20px;color:var(--accent-ink);flex:none}
.gsearch input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font-size:16px;padding:12px 0;outline:none}
.gsearch input::-webkit-search-cancel-button{display:none}
.hmenu{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.hmenu::-webkit-scrollbar{display:none}
.hmenu button{flex:none;display:flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;border:1px solid var(--glass-b);background:var(--glass);color:var(--ink);font-size:13.5px;font-weight:600;white-space:nowrap}
.hmenu button svg{width:15px;height:15px;color:var(--accent-ink)}
.gres{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:18px;border:1px solid var(--glass-b);background:#0C1C2C}
.gres-i{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--glass-b);background:rgba(255,255,255,.03);color:var(--ink)}
.gres-i:hover{border-color:rgba(227,181,74,.4)}
.gres-i b{font-size:15px}
.gres-i .pill{font-size:11px}
.gres-s{font-size:13px;color:var(--muted);line-height:1.45}
.sec-title{scroll-margin-top:130px}
/* destaque do DragãoDrive */
.drive-hl{display:grid;grid-template-columns:96px minmax(0,1fr);gap:18px;align-items:center;padding:18px 20px;border-radius:22px;border:1px solid rgba(227,181,74,.4);background:radial-gradient(360px 200px at 0% 50%,rgba(226,85,60,.25),transparent 70%),linear-gradient(135deg,#1A2433,#0C1622)}
.drive-art svg{width:100%;height:auto}
.drive-txt{display:flex;flex-direction:column;gap:8px;min-width:0}
.drive-txt b{font-family:var(--f-display);font-size:22px;font-weight:800}
.drive-txt p{color:#C3D2E0;font-size:14.5px;line-height:1.5}
.drive-hl a.btn{text-decoration:none}
@media (max-width:560px){.drive-hl{grid-template-columns:64px minmax(0,1fr);gap:12px;padding:16px}.drive-txt b{font-size:19px}}
/* apps da tripulação */
.appcard{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center;padding:20px;border-radius:24px;border:1px solid var(--glass-b);overflow:hidden}
.appcard.hi{background:radial-gradient(420px 260px at 0% 0%,rgba(61,220,151,.25),transparent 70%),linear-gradient(135deg,#0F7A4A,#0A3F2A)}
.appcard.desf{background:radial-gradient(420px 260px at 0% 0%,rgba(56,200,230,.22),transparent 70%),linear-gradient(135deg,#123247,#0A1A28)}
.app-phones{display:flex;gap:12px}
.app-phones figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.app-phones figcaption{font-size:12px;font-weight:600;color:rgba(255,255,255,.8)}
.phone{width:132px;aspect-ratio:420/700;border-radius:20px;border:5px solid #06090D;overflow:hidden;background:#06090D;box-shadow:0 14px 34px rgba(0,0,0,.45)}
.phone img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.app-info{display:flex;flex-direction:column;gap:12px;min-width:0}
.app-info p{color:rgba(255,255,255,.85);font-size:14.5px;line-height:1.55}
.app-head{display:flex;align-items:center;gap:12px}
.app-head b{display:block;font-family:var(--f-display);font-size:21px;font-weight:800;color:#fff}
.app-icon{width:52px;height:52px;border-radius:14px;box-shadow:0 6px 16px rgba(0,0,0,.35);flex:none}
.app-tag{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:#FFD66B}
.appcard a.btn{text-decoration:none}
.sec-title .btn{white-space:nowrap}
.btn.app-go{background:#fff;color:#0A2A1C;border-color:transparent;font-weight:700}
.desf .btn.app-go{background:linear-gradient(90deg,#3DDC97,#38C8E6);color:#06202A}
.btn.app-go2{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.3)}
.btn.app-go svg,.btn.app-go2 svg{width:16px;height:16px}
.app-soon{font-size:13px;color:rgba(255,255,255,.75);font-weight:600}
.app-edit{color:#fff}
.apps-home{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.apps-home .appcard{padding:16px;gap:14px}
.apps-home .phone{width:96px;border-width:4px;border-radius:16px}
.apps-home .app-info p{font-size:13.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
@media (max-width:820px){.apps-home{grid-template-columns:1fr}}
@media (max-width:560px){
  .appcard{grid-template-columns:1fr;padding:18px}
  .appcard .app-phones{justify-content:center;order:2}
  .apps-home .appcard{grid-template-columns:auto minmax(0,1fr);gap:12px}
  .apps-home .app-phones{order:0}
  .apps-home .phone{width:84px}
  .apps-home .app-head b{font-size:18px}
  .apps-home .app-icon{width:40px;height:40px;border-radius:11px}
}
/* marinharia */
.cinta-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.cinta-card{position:relative;display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:var(--r);border:1px solid var(--glass-b);background:linear-gradient(180deg,var(--glass),rgba(255,255,255,.015));overflow:hidden}
.cinta-card>div{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cinta-card b{font-family:var(--f-display);font-size:17px}
.cinta-card .num{font-family:var(--f-mono);font-weight:700;font-size:20px;color:var(--accent-ink)}
.cinta-card small{font-size:12.5px;color:var(--muted)}
.cinta-sw{position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.sling-svg{width:100%;height:auto}
.etq-svg{width:100%;max-width:340px;height:auto}
.etq-row{display:flex;gap:12px;align-items:center;font-size:14.5px}
.etq-sw{width:34px;height:24px;border-radius:5px;flex:none;border:1px solid rgba(255,255,255,.25)}
.modo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.modo-card{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px;border-radius:var(--r);border:1px solid var(--glass-b);background:rgba(0,0,0,.18);text-align:center}
.modo-card b{font-size:13.5px;line-height:1.25}
.modo-card .num{font-family:var(--f-mono);font-weight:700;color:var(--accent-ink);font-size:17px}
.modo-svg{width:110px;height:120px}
.cinta-pick{display:flex;flex-wrap:wrap;gap:8px}
.cpick{border:2px solid var(--c);background:rgba(0,0,0,.25);color:var(--ink);border-radius:999px;padding:7px 13px;font-weight:700;font-family:var(--f-mono);font-size:13.5px;cursor:pointer}
.cpick[aria-pressed="true"]{background:var(--c);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.modo-d{display:block;font-size:12px;color:var(--muted);font-weight:400;margin-top:2px}
.rl .modo-d+b,.rl b{flex:none}
.tile.insp{min-height:0;cursor:default}
.tile-i.bad{background:rgba(240,106,92,.14);color:var(--bad)}
.lst{display:flex;flex-direction:column;gap:10px;padding-left:20px;font-size:14.5px;line-height:1.5}
.norma{display:flex;flex-direction:column;gap:3px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.norma:last-child{border-bottom:0}
@media (max-width:600px){.cinta-grid{grid-template-columns:1fr 1fr;gap:10px}.cinta-card{padding:10px 10px 10px 14px}.cinta-card b{font-size:15px}.cinta-card .num{font-size:17px}}
/* calculadoras */
.seg4{display:flex;overflow-x:auto;scrollbar-width:none}
.seg4::-webkit-scrollbar{display:none}
.seg4 button{flex:1 0 auto;padding:10px 14px;font-size:13.5px;white-space:nowrap}
.ter-g{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:10px;align-items:center}
.ter-g label{font-size:14px;font-weight:600}
.ter-g .est{font-size:11.5px;color:var(--muted);display:block;font-weight:500}
.calc-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.calc-out{position:sticky;top:16px;gap:16px}
.fields3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.inwrap{position:relative}
.inwrap .suf{position:absolute;right:13px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none}
.inwrap .input{padding-right:44px}
.cks{display:flex;flex-wrap:wrap;gap:8px}
.ck{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:12px;border:1px solid var(--glass-b);background:rgba(0,0,0,.2);font-size:14.5px;font-weight:600;cursor:pointer}
.ck input{width:18px;height:18px;accent-color:var(--accent)}
.big-res{display:flex;flex-direction:column;gap:2px;padding:16px;border-radius:16px;background:linear-gradient(135deg,rgba(227,181,74,.16),rgba(255,255,255,.02));border:1px solid rgba(227,181,74,.35)}
.big-res small{font-size:12.5px;font-weight:600;color:var(--muted)}
.big-res span{font-family:var(--f-mono);font-weight:700;font-size:clamp(28px,5vw,36px);color:var(--accent-ink);line-height:1.15}
.big-res em{font-style:normal;font-size:13px;color:var(--muted)}
.rl{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.rl span{color:var(--muted)}
.rl.tot span{color:var(--ink);font-weight:700}
.rl.tot b{color:var(--accent-ink)}
.rl-h{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink);font-weight:700;margin-bottom:2px}
td.hl{color:var(--accent-ink);font-weight:700}
.ed-h{font-family:var(--f-display);font-weight:800;font-size:15px;margin-top:8px;color:var(--accent-ink)}
.ed-card{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:14px;border:1px solid var(--glass-b);background:rgba(0,0,0,.18)}
@media (max-width:820px){.calc-grid{grid-template-columns:1fr}.calc-out{position:static}}
@media (max-width:600px){.tbl-wrap.sm3 td{font-size:12.5px;letter-spacing:-.02em}}
@media (max-width:420px){.fields3 .inwrap .input{padding-right:30px}.fields3 .inwrap .suf{right:9px}}
.gate-foot{font-size:12.5px;color:var(--faint);margin-top:12px;line-height:1.5}
@media (max-width:820px){.gate{align-items:flex-start}.gate-in{grid-template-columns:1fr;gap:20px}.gate-hero{text-align:center}.gate-hero img{margin:0 auto;width:72px;height:72px}.gate-hero p{font-size:15px}}
.boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted)}
</style>
</head>
<body>
<div class="boot" id="boot">Carregando…</div>
<div class="gate" id="gate" hidden></div>
<div class="app" id="app" hidden>
  <aside class="side">
    <div class="brand"><img src="icons/icon-192.png" alt=""><div><div class="brand-name">Almanaque</div><div class="brand-sub">Primeira Divisão</div></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot"><span class="sync" id="sync"><i></i><span>—</span></span><span>Conteúdo de uso interno. Não compartilhe.</span></div>
  </aside>
  <main class="main"><div class="wrap" id="view"></div></main>
  <nav class="tabbar" id="tabbar"></nav>
</div>
<div id="modal"></div>
<script>
/* ======================= BASE ======================= */

function setSync(st){

function loadCache(id){ const c = lsGet(CACHE(id), null); if (c) { S.member = c.member; S.content = c.content || {}; } return !!c; }

async function fetchAll(){
  const m = await sb.from("alm_members").select("*").eq("user_id", S.user.id).maybeSingle();
  if (m.error) throw m.error;
  S.member = m.data;
  if (!S.member) {
    const nome = ((S.user.user_metadata && S.user.user_metadata.alm_nome) || "").slice(0, 40);
    const ins = await sb.from("alm_members").insert({user_id:S.user.id, email:S.user.email, nome}).select().single();
    if (ins.error) throw ins.error;
    S.member = ins.data;
  }
  if (isMember()) {
    const pend = lsGet(PEND, {});
    const r = await sb.from("alm_content").select("key,audience,data,updated_at");
    if (r.error) throw r.error;
    const remote = {}; (r.data || []).forEach(x => remote[x.key] = x);
    for (const k in pend) if (pend[k] && S.content[k]) remote[k] = S.content[k]; // edição feita sem internet vence
    S.content = remote;
    if (isAdmin()) await loadMembers();
    await flushPending();
  }
  saveCache();
}
async function loadMembers(){
  const r = await sb.from("alm_members").select("*").order("created_at");

/* Salvar conteúdo (só admin): guarda no aparelho na hora e envia quando houver conexão. */
let saveTimer = null;
function putContent(key){
  S.content[key].updated_at = new Date().toISOString();
  const pend = lsGet(PEND, {}); pend[key] = true; lsSet(PEND, pend);
  saveCache(); setSync("saving");
  clearTimeout(saveTimer); saveTimer = setTimeout(flushPending, 600);
}
async function flushPending(){
  const pend = lsGet(PEND, {}), keys = Object.keys(pend).filter(k => pend[k]);
  if (!keys.length) { setSync(S.offline ? "err" : "ok"); return; }
  if (!navigator.onLine || !S.user || S.offline) { setSync("err"); return; }
  setSync("saving");
  try {
    for (const k of keys) {
      const c = S.content[k]; if (!c) { delete pend[k]; continue; }
      const r = await sb.from("alm_content").upsert({key:k, audience:c.audience || "admin", data:c.data});
      if (r.error) throw r.error;
      delete pend[k]; lsSet(PEND, pend);
    }
    setSync("ok");
  } catch (e) { console.warn(e); setSync("err"); }
}
/* Volta da conexão: o evento "online" nem sempre dispara (wi-fi de bordo sem internet), então também tenta de novo ao voltar para o app e a cada minuto enquanto houver algo pendente. */

const hasToken = () => { try { return Object.keys(localStorage).some(k => /^sb-.*-auth-token$/.test(k)); } catch (e) { return false; } };
async function onSession(session){
  const u = session && session.user;
  if (!u) {
    const lu = lsGet(LAST, null);
    if (lu && hasToken() && loadCache(lu.id)) { S.user = lu; S.offline = true; showApp(); setSync("err"); return; }
    S.user = null; S.member = null; S.content = {}; showGate(); return;
  }
  if (S.user && S.user.id === u.id && !S.offline && S.member) return;
  S.user = u; S.offline = false;
  lsSet(LAST, {id:u.id, email:u.email, user_metadata:u.user_metadata || {}});
  const cached = loadCache(u.id);
  if (cached) showApp();
  try { await fetchAll(); setSync("ok"); }
  catch (e) { console.warn(e); setSync("err"); if (!cached) { AUTH.msg = "Não foi possível carregar agora. Verifique a conexão e tente de novo."; showGate(); return; } }
  showApp();
}

}

  onSession(session);
}, 0));

function gSnippet(txt, terms){
  const n = norm(txt), k = terms.map(t => n.indexOf(t)).filter(x => x >= 0).sort((a, b) => a - b)[0] || 0;

}
function gResults(q){
  const terms = norm(q).split(/\s+/).filter(Boolean); if (!terms.length) return "";

  return `<div class="sub" style="padding:2px 4px 6px">${hits.length === 40 ? "40 primeiros resultados" : hits.length + (hits.length === 1 ? " resultado" : " resultados")}</div>` + hits.map(h => `<button class="gres-i" data-act="${h.act}" data-arg="${esc(h.arg)}"${h.i != null ? ` data-i="${esc(h.i)}"` : ""}><span class="pill">${esc(h.tipo)}</span><b>${esc(h.t)}</b>${h.sub ? `<span class="sub">${esc(h.sub)}</span>` : ""}<span class="gres-s">${esc(gSnippet(h.txt, terms))}</span></button>`).join("");
}

const pnum = s => { s = String(s == null ? "" : s).trim().replace(/\s/g, ""); if (s.includes(",")) s = s.replace(/\./g, "").replace(",", "."); const v = parseFloat(s); return isFinite(v) ? v : 0; };
const brl = v => (isFinite(v) ? v : 0).toLocaleString("pt-BR", {style:"currency", currency:"BRL"});

  param:{pensao:10.5, fusma:3.5, fusmaDep:0.3, irDep:189.59, irSimpl:607.2, redLim:5000, redMax:312.89, redFim:7350, redK:978.62, redF:0.133145},

  carreira:{total:35, fases:[{g:"Aprendiz-Marinheiro", meses:12}, {g:"Marinheiro (especializado/engajado)", meses:48}, {g:"Cabo (engajado)", meses:77}, {g:"Terceiro-Sargento", meses:72}, {g:"Segundo-Sargento", meses:72}, {g:"Primeiro-Sargento", meses:72}, {g:"Suboficial", meses:null}]}
};

const irTabela = (T, b) => { const f = T.find(r => r[0] == null || r[0] === "" || b <= r[0]) || T[T.length - 1]; return Math.max(0, b * f[1] / 100 - f[2]); };
function remCalc(F, x){
  const g = F.grads.find(a => a.nome === x.grad) || F.grads[0];
  const c = F.cursos.find(a => a.nome === (x.curso || g.curso)) || {nome:"Nenhum", pct:0};
  const P = F.param, s = g.soldo, acdm = Math.max(x.acdm || 0, g.acdm, x.ats || 0);
  const L = [["Soldo", s], ["Adicional Militar (" + pct(g.am) + ")", s * g.am / 100], ["Adicional de Habilitação (" + pct(c.pct) + ")", s * c.pct / 100], [((x.ats || 0) > Math.max(x.acdm || 0, g.acdm) ? "Adicional de Tempo de Serviço" : "Adic. Compensação Disponibilidade") + " (" + pct(acdm) + ")", s * acdm / 100]];
  if (x.loc) L.push(["Gratificação de localidade especial (" + pct(x.loc) + ")", s * x.loc / 100]);
  if (x.org) L.push(["Adicional de compensação orgânica (" + pct(x.org) + ")", s * x.org / 100]);
  const bruta = L.reduce((a, l) => a + l[1], 0), aux = (x.pre || 0) + (x.transp || 0);
  const pensao = bruta * P.pensao / 100, fusma = bruta * (P.fusma + P.fusmaDep * (x.depF || 0)) / 100;
  const base = Math.max(0, bruta - Math.max(pensao + (x.depIR || 0) * P.irDep, P.irSimpl));
  const irT = irTabela(F.ir, base);
  const red = bruta <= P.redLim ? Math.min(irT, P.redMax) : bruta <= P.redFim ? Math.max(0, P.redK - P.redF * bruta) : 0;
  const ir = Math.max(0, irT - red), desc = pensao + fusma + ir;
  return {g, c, L, bruta, aux, pensao, fusma, base, irT, red, ir, desc, liq:bruta + aux - desc, d13:bruta, ferias:bruta / 3, ano:bruta * 12 + bruta + bruta / 3 + aux * 12};
}
/* Fases da carreira com o Suboficial ficando com o resto do tempo até a reserva. */
function fases(F){
  const C = F.carreira, tot = C.total * 12, fs = C.fases.map(f => ({...f}));
  const usado = fs.filter(f => f.meses != null).reduce((a, f) => a + f.meses, 0);
  fs.forEach(f => { if (f.meses == null) f.meses = Math.max(0, tot - usado); });
  let ini = 0; fs.forEach(f => { f.ini = ini / 12; ini += f.meses; f.fim = ini / 12; f.anos = f.meses / 12; });
  return fs;
}
function invest(F, pcts, taxa, anosRenda){
  const fs = fases(F), N = Math.round(F.carreira.total), r = taxa / 100, i = Math.pow(1 + r, 1 / 12) - 1;
  const fat = i ? (Math.pow(1 + i, 12) - 1) / i : 12;
  const soldoAno = y => { const f = [...fs].reverse().find(f => f.ini <= y - 1) || fs[0]; const g = F.grads.find(a => a.nome === f.g); return g ? g.soldo : 0; };
  const anos = []; for (let y = 1; y <= N; y++) anos.push(soldoAno(y));
  const so = remCalc(F, {grad:fs[fs.length - 1].g});
  return pcts.map(p => {
    let pat = 0; anos.forEach(s => { pat = pat * (1 + r) + p / 100 * s * fat; });
    const guard = p / 100 * anos.reduce((a, s) => a + s, 0) * 12, n = anosRenda * 12;
    const renda = pat * i, pmt = n ? (i ? pat * i / (1 - Math.pow(1 + i, -n)) : pat / n) : 0;
    return {p, ini:p / 100 * anos[0], fim:p / 100 * anos[anos.length - 1], guard, pat, rend:pat - guard, renda, pmt, comp:so.liq ? renda / so.liq * 100 : 0};
  });
}

function tintaOut(v){
  const c = pnum(v.c), l = pnum(v.l), h = pnum(v.h);
  const partes = v.modo === "area" ? [["Área informada", pnum(v.area)]] : [v.ant && ["Anteparas", 2 * (c + l) * h], v.teto && ["Teto", c * l], v.conves && ["Convés", c * l]].filter(Boolean);
  const bruta = partes.reduce((a, p) => a + p[1], 0), desc = pnum(v.desc), area = Math.max(0, bruta - desc);
  const dem = Math.max(1, Math.round(pnum(v.demaos)) || 1), perda = pnum(v.perda), rend = pnum(v.rend);
  const total = area * dem * (1 + perda / 100), baldes = rend ? total / rend : 0;
  const head = !area ? `<div class="big-res"><small>Baldes</small><span>—</span><em>Preencha as medidas do compartimento.</em></div>`
    : !rend ? `<div class="big-res"><small>Baldes</small><span>—</span><em>Falta o rendimento do balde.</em></div>`
    : `<div class="big-res"><small>Você vai precisar de</small><span>${Math.ceil(baldes - 1e-9)} ${Math.ceil(baldes - 1e-9) === 1 ? "balde" : "baldes"}</span><em>${nf(baldes, 2)} baldes pela conta exata</em></div>`;
  return `${head}
    <div class="col" style="gap:0">${partes.map(p => rl(p[0], nf(p[1]) + " m²")).join("")}
      ${desc ? rl("Descontos", "− " + nf(desc) + " m²") : ""}
      ${rl("Área a pintar", nf(area) + " m²", "tot")}
      ${rl(`${dem} ${dem === 1 ? "demão" : "demãos"}${perda ? ` + ${nf(perda)}% de perda` : ""}`, nf(total) + " m²")}
      ${rend ? rl("Rendimento por balde", nf(rend) + " m²") : ""}</div>
    ${v.modo !== "area" && v.ant ? `<p class="sub" style="font-size:12.5px">Anteparas: perímetro (2 × comprimento + 2 × largura) × altura.</p>` : ""}`;
}

/* Espias: a Marinha mede o cabo pela circunferência (bitola, em polegadas). Resistência cresce com a área da seção, ou seja, com C².
   Carga de ruptura estimada = k × C² (C em polegadas, k em lbf), regra de bolso de marinharia.
   k calibrado nas tabelas de cabos de 3 pernas por diâmetro (Cordage Institute / tabelas de marinharia: 1" de diâmetro = sisal 7.200, manila 9.000, polipropileno 14.000, poliéster 18.500, nylon 24.600 lbf)
   e, no aço, na tabela 6×19 IPS (1" = 83.600 lbf, alma de fibra; alma de aço ≈ +7,5%). Fibras de alto desempenho: catálogos de 12 pernas trançados. */
const ESP_MAT = [
  {id:"sisal", nome:"Sisal (fibra vegetal)", k:730, obs:"Perde força molhado e com o tempo; apodrece se guardado úmido."},
  {id:"manila", nome:"Manilha (fibra vegetal)", k:900, obs:"Referência clássica: C² × 900 lbf. Molhada perde até ~10%."},
  {id:"pe", nome:"Polietileno (PE comum)", k:1200, obs:"Flutua, barato, escorregadio; sensível ao sol."},
  {id:"pp", nome:"Polipropileno", k:1400, obs:"Flutua; perde força com sol (UV) e aquecimento por atrito."},
  {id:"pes", nome:"Poliéster", k:1900, obs:"Estica pouco, bom contra sol e abrasão; mantém a força molhado."},
  {id:"nylon", nome:"Nylon (poliamida)", k:2500, obs:"Estica muito e absorve choque; molhado perde ~10–15%. Cuidado com o chicote (snap-back)."},
  {id:"aramida", nome:"Kevlar / aramida", k:9000, obs:"Muito forte e quase não estica; sensível a dobras fechadas, atrito interno e UV. Varia muito pela construção."},
  {id:"hmpe", nome:"Polietileno de alto desempenho (HMPE, Dyneema)", k:10000, obs:"Forte como aço com 1/7 do peso; flutua. Varia muito pela construção."},
  {id:"aco_fc", nome:"Cabo de aço 6×19, alma de fibra", k:8500, obs:"Aço IPS (improved plow steel). Pernas e alma mudam muito a carga: veja o certificado."},
  {id:"aco_iwrc", nome:"Cabo de aço 6×19/6×36, alma de aço", k:9100, obs:"Alma de aço (IWRC) ≈ 7,5% mais forte que a de fibra."}
];
const LBF_KGF = 0.45359237, LBF_KN = 0.0044482216;
/* Aceita 3, 3,5, 3.5, 3 1/2, 3½, 1/2. */
function pfrac(s){
  s = String(s == null ? "" : s).trim().replace(/[½¼¾⅛⅜⅝⅞]/g, m => " " + ({"½":"1/2","¼":"1/4","¾":"3/4","⅛":"1/8","⅜":"3/8","⅝":"5/8","⅞":"7/8"})[m]).trim();
  const m = s.match(/^(\d+(?:[.,]\d+)?)?\s*(?:(\d+)\s*\/\s*(\d+))?$/);
  if (m && m[2]) return (m[1] ? pnum(m[1]) : 0) + (+m[3] ? m[2] / m[3] : 0);
  return pnum(s);
}
/* Polegada em fração de 1/8 (como se fala no cais): 3,5 → 3½". */
function polFr(x){
  const e = Math.round(x * 8) / 8, i = Math.floor(e), f = Math.round((e - i) * 8);
  const fr = {0:"", 1:"⅛", 2:"¼", 3:"⅜", 4:"½", 5:"⅝", 6:"¾", 7:"⅞"}[f];
  return (i || !fr ? String(i) : "") + fr + "\"";
}
const tf = kgf => kgf >= 1000 ? nf(kgf / 1000, kgf >= 10000 ? 1 : 2) + " tf" : nf(kgf, 0) + " kgf";
function viewEspias(){
  const v = Object.assign({med:"circ", un:"pol", val:"", mat:"nylon", fs:"6"}, calcGet("espias"));
  const circ = v.med !== "diam";
  return `<button class="back" data-act="toolBack">${ic("left")}Calculadoras</button>

    <div class="calc-grid">
      <form class="card col" data-calc="espias" onsubmit="return false">
        <input type="hidden" name="med" value="${circ ? "circ" : "diam"}">
        <div class="field"><label>O que você mediu</label><div class="seg"><button type="button" data-act="espMed" data-arg="circ" aria-pressed="${circ}">Circunferência</button><button type="button" data-act="espMed" data-arg="diam" aria-pressed="${!circ}">Diâmetro</button></div></div>
        <div class="fields2">${inF("val", circ ? "Circunferência" : "Diâmetro", v.val, {ph:circ ? "ex.: 8" : "ex.: 64"})}

        <span class="sub" style="font-size:12.5px;margin-top:-6px">Em polegadas pode escrever 3,5 ou 3 1/2.</span>
        ${`<div class="field"><label for="c-mat">Material</label><select id="c-mat" class="input" name="mat">${ESP_MAT.map(m => `<option value="${m.id}" ${m.id === v.mat ? "selected" : ""}>${esc(m.nome)}</option>`).join("")}</select></div>`}
        ${inF("fs", "Fator de segurança", v.fs, {suf:"÷", hint:"Carga de trabalho = ruptura ÷ fator. Padrão 6 para espias em uso; use mais para cabo velho, molhado ou com carga de choque."})}
      </form>
      <div class="card col calc-out" id="calc-out">${espiasOut(v)}</div>
    </div>
    <div class="card col" id="esp-tab">${espiasTab(v)}</div>
    ${espiasRef()}
    ${espiasExpl(v)}
    <div class="note warn">${ic("info")}<span><b>Estimativa.</b> As cargas são regras de bolso de marinharia para cabo novo, seco e sem nós. Construção (3 pernas, 8 pernas, trançado), fabricante e estado do cabo mudam muito o valor. <b>O certificado do fabricante prevalece</b>, e as normas e ordens do navio valem sobre esta conta. Nós reduzem a resistência em 40–50%; costuras (mãozinhas), em 10–15%.</span></div>`;
}
function espMedidas(v){
  const x = pfrac(v.val), un = v.un, circ = v.med !== "diam";
  const pol = un === "pol" ? x : un === "cm" ? x / 2.54 : x / 25.4;
  const C = circ ? pol : pol * Math.PI, d = C / Math.PI;
  return {C, dPol:d, dMm:d * 25.4, cCm:C * 2.54, area:Math.PI * Math.pow(d * 25.4, 2) / 4};

function espCarga(m, C, fs){ const lbf = m.k * C * C; return {lbf, kgf:lbf * LBF_KGF, kN:lbf * LBF_KN, swl:lbf * LBF_KGF / fs}; }
const espFs = v => Math.max(1, pnum(v.fs) || 6);
function espiasOut(v){
  const M = espMedidas(v), fs = espFs(v), m = ESP_MAT.find(x => x.id === v.mat) || ESP_MAT[0];
  if (!(M.C > 0)) return `<div class="big-res"><small>Bitola</small><span>—</span><em>Digite a medida do cabo.</em></div>`;
  const R = espCarga(m, M.C, fs);
  return `<div class="big-res"><small>Bitola (circunferência)</small><span>${nf(M.C, 2)}"</span><em>≈ ${polFr(M.C)} · ${nf(M.cCm, 1)} cm de circunferência</em></div>
    <div class="chips"><div class="chip-v"><small>Diâmetro</small><span>${nf(M.dMm, 1)} mm</span></div><div class="chip-v"><small>Diâmetro</small><span>${nf(M.dPol, 2)}"</span></div><div class="chip-v"><small>≈ em fração</small><span>${polFr(M.dPol)}</span></div></div>
    <div class="col" style="gap:0"><div class="rl-h">${esc(m.nome)}</div>
      ${rl("Carga de ruptura estimada", tf(R.kgf), "tot")}
      ${rl("Em quilonewtons", nf(R.kN, 1) + " kN")}
      ${rl("Em libras-força", nf(R.lbf, 0) + " lbf")}
      ${rl(`Carga de trabalho (÷ ${nf(fs, 1)})`, tf(R.swl), "tot")}</div>
    <p class="sub" style="font-size:12.5px">${esc(m.obs)}</p>
    <p class="sub" style="font-size:12.5px">Conta: ${nf(m.k, 0)} × C² lbf, com C = ${nf(M.C, 2)}" (C² = ${nf(M.C * M.C, 2)}).</p>`;
}
function espiasTab(v){
  const M = espMedidas(v), fs = espFs(v);

  return `<div class="rl-h">Todos os materiais · bitola ${nf(M.C, 2)}" (${nf(M.dMm, 0)} mm de diâmetro)</div>
    <div class="tbl-wrap"><table><thead><tr><th>Material</th><th>Ruptura</th><th>Trabalho (÷ ${nf(fs, 1)})</th><th>× manilha</th></tr></thead><tbody>${ESP_MAT.map(m => { const R = espCarga(m, M.C, fs);
      return `<tr><td>${esc(m.nome)}</td><td data-l="Ruptura" class="${m.id === v.mat ? "hl" : ""}">${tf(R.kgf)}</td><td data-l="Trabalho">${tf(R.swl)}</td><td data-l="× manilha">${nf(m.k / 900, 1)}×</td></tr>`; }).join("")}</tbody></table></div>`;

function espiasRef(){
  const B = [1, 1.5, 2, 2.5, 3, 3.5, 4, 4.5, 5, 6, 7, 8, 9, 10, 12];
  const k = id => ESP_MAT.find(m => m.id === id).k;
  return `<details class="card col"><summary style="cursor:pointer;font-weight:700">Tabela rápida de bitolas</summary>
    <p class="sub" style="font-size:13px">Bitola é a circunferência em polegadas. Diâmetro nominal = circunferência ÷ π. Ruptura estimada, cabo novo.</p>
    <div class="tbl-wrap"><table><thead><tr><th>Bitola</th><th>Diâmetro</th><th>Manilha</th><th>Polipropileno</th><th>Nylon</th><th>Aço (alma de aço)</th></tr></thead><tbody>${B.map(C => `<tr><td>${polFr(C)}</td><td data-l="Diâmetro">${nf(C / Math.PI * 25.4, 0)} mm</td>${["manila", "pp", "nylon", "aco_iwrc"].map((id, i) => `<td data-l="${["Manilha", "Polipropileno", "Nylon", "Aço"][i]}">${tf(k(id) * C * C * LBF_KGF)}</td>`).join("")}</tr>`).join("")}</tbody></table></div></details>`;
}
function espiasExpl(v){
  return `<details class="card col"><summary style="cursor:pointer;font-weight:700">Por que a Marinha mede pela circunferência?</summary>
    <p>Na Marinha, <b>bitola</b> de cabo é a <b>circunferência em polegadas</b>. É tradição da marinharia inglesa, de onde vem boa parte da nossa: um cabo de 3 pernas não é um cilindro perfeito, então medir o diâmetro com paquímetro dá valores diferentes conforme a posição. Já passar uma fita ou um barbante em volta dá sempre a mesma medida, e dá para fazer no convés, com o cabo em uso. O comércio e os fabricantes usam o diâmetro em milímetros, então é bom saber converter: <b>diâmetro = circunferência ÷ π</b> (≈ 3,14). Uma espia de 8" tem cerca de 65 mm de diâmetro.</p>
    <p><b>A relação C².</b> A força de um cabo depende da área da seção (quanto material tem no corte), e área cresce com o quadrado da medida. Por isso a regra de bolso é <b>carga = k × C²</b>: dobrar a bitola dá <b>4 vezes</b> a resistência (2² = 4), e triplicar dá 9 vezes. O contrário também vale: um cabo com metade da bitola aguenta só um quarto. O <b>k</b> muda com o material: manilha ≈ 900, nylon ≈ 2.500, aço ≈ 9.000 (C em polegadas, carga em libras-força).</p>
    <p><b>E a bitola de fio elétrico?</b> No fio elétrico, a bitola é a <b>área da seção em mm²</b> (1,5 · 2,5 · 4 · 6 mm²…), não a circunferência nem o diâmetro. É a mesma ideia: a corrente que o fio conduz depende da área de cobre, assim como a força do cabo depende da área de fibra. Um fio de 2,5 mm² tem só 1,8 mm de diâmetro. Para comparar, a área nominal da seção do cabo medido aparece abaixo.</p>

    <p class="sub" style="font-size:12.5px">Referências: regra C² da marinharia (manilha ≈ C² × 900 lbf); tabelas de ruptura de cabos de 3 pernas por diâmetro (sisal, manilha, polipropileno, poliéster, nylon) do Cordage Institute e manuais de marinharia; tabela de cabo de aço 6×19 IPS (Engineering ToolBox); catálogos de fabricantes de cabos HMPE e aramida (12 pernas). Fator de segurança de 4 a 6 para cabos de fibra, conforme manuais de marinharia.</p></details>`;
}

function invOut(F, v){

/* Quanto deveria ter: mês a mês desde a entrada, guardando um % do soldo da graduação de cada época (soldos de hoje). */
const mIdx = v => { const m = /^(\d{4})-(\d{2})$/.exec(v || ""); return m ? +m[1] * 12 + +m[2] - 1 : null; };
const mTxt = i => String(i % 12 + 1).padStart(2, "0") + "/" + Math.floor(i / 12);
const mVal = i => Math.floor(i / 12) + "-" + String(i % 12 + 1).padStart(2, "0");
const hoje = () => { const d = new Date(); return d.getFullYear() * 12 + d.getMonth(); };
function terDatas(F, v){
  const fs = fases(F), n = Math.max(1, fs.findIndex(f => f.g === v.atual) + 1 || fs.length);
  const ent = mIdx(v.ent) == null ? hoje() - 12 * 15 : mIdx(v.ent), d = [];
  for (let k = 0; k < n; k++) {
    const dig = k === 0 ? ent : mIdx(v["p" + k]);
    let est = k === 0 ? ent : d[k - 1].ini + fs[k - 1].meses;
    for (let j = k + 1; j < n; j++) { const x = mIdx(v["p" + j]); if (x != null) { est = Math.min(est, x); break; } }
    d.push({g:fs[k].g, ini:dig != null ? dig : Math.min(est, hoje()), est:dig == null});
  }
  return d;
}
function finTer(F){
  const fs = fases(F), v = Object.assign({ent:"", atual:fs[Math.min(4, fs.length - 1)].g, pct:"15", taxa:"5"}, calcGet("ter"));
  const d = terDatas(F, v);
  return `<p class="sub">Quanto você teria hoje se tivesse guardado uma parte do soldo todo mês desde que entrou. Informe quando entrou e quando foi promovido. O que ficar em branco é estimado pelo tempo mínimo de cada graduação.</p>
    <div class="calc-grid">
      <form class="card col" data-calc="ter" onsubmit="return false">
        ${selF("atual", "Sua graduação hoje", fs.map(f => f.g), v.atual)}
        <div class="ter-g"><label for="c-ent">Entrou na Marinha<span class="est">mês e ano</span></label><input id="c-ent" class="input" type="month" name="ent" value="${esc(v.ent || mVal(d[0].ini))}"></div>
        ${d.slice(1).map((x, k) => `<div class="ter-g"><label for="c-p${k + 1}">Virou ${esc(x.g)}${x.est ? `<span class="est">estimado: ${mTxt(x.ini)}</span>` : ""}</label><input id="c-p${k + 1}" class="input" type="month" name="p${k + 1}" value="${esc(v["p" + (k + 1)] || "")}"></div>`).join("")}
        <div class="fields2">${inF("pct", "Guardando do soldo", v.pct, {suf:"%"})}${inF("taxa", "Rendimento acima da inflação", v.taxa, {suf:"% a.a."})}</div>
      </form>
      <div class="card col calc-out" id="calc-out">${terOut(F, v)}</div>
    </div>`;
}
function terCalc(F, d, p, taxa){
  const i = Math.pow(1 + taxa / 100, 1 / 12) - 1, fim = hoje();
  let pat = 0, guard = 0; const por = d.map(x => ({g:x.g, ini:x.ini, meses:0, mes:0, guard:0}));
  for (let m = d[0].ini; m < fim; m++) {
    let k = 0; d.forEach((x, j) => { if (x.ini <= m) k = j; });
    const g = F.grads.find(a => a.nome === d[k].g), dep = p / 100 * (g ? g.soldo : 0);
    pat = pat * (1 + i) + dep; guard += dep; por[k].meses++; por[k].mes = dep; por[k].guard += dep;
  }
  return {pat, guard, por};
}
function terOut(F, v){
  const d = terDatas(F, v), p = pnum(v.pct), taxa = pnum(v.taxa), R = terCalc(F, d, p, taxa);
  if (!R.por.some(x => x.meses)) return `<div class="big-res"><small>Você deveria ter hoje</small><span>—</span><em>Confira a data de entrada.</em></div>`;
  const anos = Math.floor((hoje() - d[0].ini) / 12);
  return `<div class="big-res"><small>Guardando ${pct(p)} do soldo desde ${mTxt(d[0].ini)}, você teria hoje</small><span>${brl(R.pat)}</span><em>${brl(R.guard)} saíram do seu bolso e ${brl(R.pat - R.guard)} vieram do rendimento, em ${anos} ${anos === 1 ? "ano" : "anos"} de serviço.</em></div>
    <div class="col" style="gap:0"><div class="rl-h">Graduação por graduação</div>
      ${R.por.filter(x => x.meses).map(x => `<div class="rl" style="flex-direction:column;gap:2px"><span style="color:var(--ink);font-weight:700">${esc(x.g)}</span><span style="font-size:13px">${mTxt(x.ini)} a ${mTxt(x.ini + x.meses - 1)} · ${anosTxt(x.meses / 12)} · guardava ${brl(x.mes)} por mês</span><b class="num" style="align-self:flex-end">${brl(x.guard)} guardados</b></div>`).join("")}</div>
    <div class="chips">${[10, 15, 20].filter(x => x !== p).map(x => `<div class="chip-v"><small>Guardando ${x}%</small><span>${brl(terCalc(F, d, x, taxa).pat)}</span></div>`).join("")}</div>
    <p class="sub" style="font-size:12.5px">Usa o soldo de hoje de cada graduação, então o valor já está em dinheiro de hoje. O rendimento é o real, acima da inflação.</p>`;
}
function calcUpdate(f){
  const k = f.dataset.calc, v = formVals(f), out = $("#calc-out"); calcSet(k, v); if (!out) return;
  if (k === "tinta") out.innerHTML = tintaOut(v);
  else if (k === "cinta") { out.innerHTML = cintaOut(v); document.querySelectorAll(".cpick").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.arg === pnum(v.cmt)))); }
  else if (k === "espias") { out.innerHTML = espiasOut(v); const t = $("#esp-tab"); if (t) t.innerHTML = espiasTab(v); const a = $("#esp-area"); if (a) a.innerHTML = espArea(v); }
  else if (k === "sim") out.innerHTML = simOut(fin(), v);
  else if (k === "inv") out.innerHTML = invOut(fin(), v);
  else if (k === "ter") out.innerHTML = terOut(fin(), v);
}

function saveFin(fd){
  const F = clone(fin()), g = k => pnum(fd.get(k));
  F.vigencia = String(fd.get("vigencia") || "").trim();
  F.grads.forEach((x, i) => { x.soldo = g("g" + i + ".soldo"); x.am = g("g" + i + ".am"); x.acdm = g("g" + i + ".acdm"); x.curso = fd.get("g" + i + ".curso") || x.curso; });
  F.cursos.forEach((c, i) => c.pct = g("c" + i));
  Object.keys(F.param).forEach(k => F.param[k] = g(k));
  F.ir.forEach((r, i) => { if (r[0] != null) r[0] = g("ir" + i + ".0"); r[1] = g("ir" + i + ".1"); r[2] = g("ir" + i + ".2"); });
  F.carreira.total = g("total") || 35;
  F.carreira.fases.forEach((f, i) => { if (f.meses != null) f.meses = Math.round(g("f" + i + ".a")) * 12 + Math.round(g("f" + i + ".m")); });
  if (F.grads.some(x => !x.soldo)) { toast("Preencha o soldo de todas as graduações"); return; }
  S.content.financeiro = {key:"financeiro", audience:"todos", data:F};
  putContent("financeiro"); closeModal(); render(); toast("Valores atualizados");
}

  modNew(){ if (!S.content.bemvindo) S.content.bemvindo = {key:"bemvindo", audience:"todos", data:{modulos:[]}}; modModal(true); },
  modEdit(){ modModal(false); },
  addSugeridos(){ const b = bem(); b.modulos = b.modulos || []; SUGERIDOS.forEach(x => { if (!b.modulos.some(m => m.id === x.id)) b.modulos.push(JSON.parse(JSON.stringify(x))); }); saveBem(); },
  modDel(){ const m = curMod(); if (!confirm(`Apagar o módulo "${m.titulo}" e todo o conteúdo dele?`)) return; bem().modulos = bem().modulos.filter(x => x.id !== m.id); S.mod = null; saveBem(); },
  secNew(){ secModal(null); },
  secEdit(a){ secModal(+a); },
  secDel(a){ const m = curMod(); if (!confirm(`Apagar a seção "${m.secoes[+a].titulo}"?`)) return; m.secoes.splice(+a, 1); OPEN[m.id] = [0]; saveBem(); },
  secMove(a, el){ const m = curMod(), i = +a, j = i + +el.dataset.d; if (j < 0 || j >= m.secoes.length) return; [m.secoes[i], m.secoes[j]] = [m.secoes[j], m.secoes[i]]; OPEN[m.id] = [j]; saveBem(); },
  blkNew(a){ blkModal(+a, null); },
  blkEdit(a, el){ blkModal(+a, +el.dataset.i); },
  blkDel(a, el){ if (!confirm("Apagar este conteúdo?")) return; curMod().secoes[+a].blocos.splice(+el.dataset.i, 1); saveBem(); },
  blkMove(a, el){ const bl = curMod().secoes[+a].blocos, i = +el.dataset.i, j = i + +el.dataset.d; if (j < 0 || j >= bl.length) return; [bl[i], bl[j]] = [bl[j], bl[i]]; saveBem(); },
  async pdf(a, el){
    if (el.disabled) return; const old = el.innerHTML; el.disabled = true; el.innerHTML = "Gerando…";
    try { await gerarPDF(a || null); } catch (e) { console.warn(e); toast("Não foi possível gerar o PDF"); }
    el.disabled = false; el.innerHTML = old;
  },
  fieldDel(a, el){ el.closest(".frow").remove(); },
  fieldAdd(){
    const i = $("#f-newcol"), c = i.value.trim().slice(0, 40); if (!c) { i.focus(); return; }
    if ([...document.querySelectorAll("#f-fields [name]")].some(x => x.name === "c:" + c)) { toast("Esse campo já existe"); return; }
    $("#f-fields").insertAdjacentHTML("beforeend", fieldRow(c, "")); i.value = ""; $("#f-fields .frow:last-child input").focus();
  },
  fieldReset(a, el){ const l = inc().locais.find(x => x.id === a); $("#f-fields").innerHTML = baseCols(l, el.dataset.i).map(c => fieldRow(c, (document.querySelector(`#f-fields [name="c:${CSS.escape(c)}"]`) || {}).value)).join(""); },
  organizeEnd(){ S.sel = null; render(); },
  pick(a){ S.sel = S.sel.includes(a) ? S.sel.filter(x => x !== a) : [...S.sel, a]; const y = scrollY; render(); scrollTo(0, y); },
  moveOpen(){ if (S.sel && S.sel.length) moveModal(); },
  moveTo(a){ moveTo(a); },
  pastaEdit(a){ pastaModal(a); },
  pastaDel(a){ const l = curLocal(); l.itens.forEach(it => { if (it.pasta === a) delete it.pasta; }); if (l.pastaCols) delete l.pastaCols[a]; putContent("incumbencias"); closeModal(); render(); toast("Pasta apagada"); },
  item(a, el){ itemModal(a, el.dataset.i); },
  itemNew(a){ itemModal(a); },
  itemDel(a, el){ if (!confirm("Apagar este item?")) return; const l = inc().locais.find(x => x.id === a); l.itens = l.itens.filter(x => x.id !== el.dataset.i); putContent("incumbencias"); closeModal(); render(); },
  localNew(){ localModal(); },
  localEdit(a){ localModal(a); },
  localDel(a){ const I = inc(), l = I.locais.find(x => x.id === a); if (!confirm(`Apagar o local "${l.nome}" e os ${l.itens.length} itens dele?`)) return; I.locais = I.locais.filter(x => x.id !== a); S.local = null; putContent("incumbencias"); closeModal(); render(); },
  step(a, el){ const all = lsGet(STEPS, {}), d = all[a] || [], i = +el.dataset.i; all[a] = d.includes(i) ? d.filter(x => x !== i) : [...d, i]; lsSet(STEPS, all); const y = scrollY; render(); scrollTo(0, y); },
  stepReset(a){ const all = lsGet(STEPS, {}); delete all[a]; lsSet(STEPS, all); const y = scrollY; render(); scrollTo(0, y); },
  memberOn(a){ memberUpdate(a, {approved:true}); },
  memberOff(a){ if (confirm("Remover o acesso deste militar?")) memberUpdate(a, {approved:false}); },
  memberDel(a){ if (confirm("Recusar este pedido?")) memberUpdate(a, null); },
  async membersReload(){ await loadMembers(); render(); },
  async recheck(){ try { await fetchAll(); render(); if (!isMember()) toast("Ainda aguardando liberação"); } catch (e) { toast("Sem conexão"); } },
  async saveNick(){ const v = $("#f-nick").value.trim().slice(0, 40); const r = await sb.rpc("alm_set_nome", {novo:v}); if (r.error) { toast(navigator.onLine ? "Não deu certo agora" : "Sem conexão"); return; } S.member.nome = v; saveCache(); render(); toast("Salvo"); },
  async logout(){
    if (Object.keys(lsGet(PEND, {})).length && !confirm("Há alterações que ainda não foram enviadas. Sair mesmo assim?")) return;
    if (S.user) lsSet(CACHE(S.user.id), null);
    lsSet(PEND, null); lsSet(LAST, null);
    S.user = null; S.member = null; S.content = {}; S.offline = false;
    try { await sb.auth.signOut(); } catch (e) {}
    AUTH.mode = "entrar"; showGate();
  },
  async install(){ if (!INSTALL_EVT) return; INSTALL_EVT.prompt(); await INSTALL_EVT.userChoice; INSTALL_EVT = null; render(); },
  authMode(a){ AUTH.mode = a; AUTH.msg = ""; AUTH.ok = ""; showGate(); },
  close(){ closeModal(); }
};
document.addEventListener("click", ev => {
  if (ev.target.matches("[data-scrim]")) { closeModal(); return; }
  const el = ev.target.closest("[data-act]"); if (!el) return;
  const fn = ACT[el.dataset.act]; if (fn) { ev.preventDefault(); fn(el.dataset.arg, el); }
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape") closeModal();
  if (ev.key === "Enter" && ev.target.id === "f-newcol") { ev.preventDefault(); ACT.fieldAdd(); }
});
document.addEventListener("input", ev => {
  if (ev.target.id === "g-q") { S.gq = ev.target.value; const r = $("#g-res"); r.hidden = !S.gq.trim(); r.innerHTML = S.gq.trim() ? gResults(S.gq) : ""; return; }
  const cf = ev.target.closest("[data-calc]");
  if (cf && cf.dataset.calc === "ter" && /^(atual|ent|p\d+)$/.test(ev.target.name)) { calcSet("ter", formVals(cf)); const y = scrollY; render(); scrollTo(0, y); return; }
  if (cf) { if (ev.target.name === "grad") { const g = fin().grads.find(x => x.nome === ev.target.value); if (g) cf.curso.value = g.curso; } calcUpdate(cf); return; }
  if (ev.target.id === "inc-q") { S.q = ev.target.value; const pos = ev.target.selectionStart; render(); const i = $("#inc-q"); if (i) { i.focus(); i.setSelectionRange(pos, pos); } }
});

/* Início: sem sessão salva mostra a entrada; com sessão o Supabase avisa pelo onAuthStateChange. */
if (!hasToken()) showGate();
if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
